services:
  - type: web
    name: github-upload-telegram-bot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: AUTHORIZED_TELEGRAM_USERS
        sync: false
      - key: MONGODB_DB_NAME
        value: zip_to_github